name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/build-windows.yml"
      - "BUILD_TRIGGER"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release EXE
        run: cargo build --release

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item target/release/rust-ytdlp-gui.exe package/Rust-yt-dlp-GUI.exe
          Copy-Item README.md package/README.txt
          Compress-Archive -Path package/* -DestinationPath Rust-yt-dlp-GUI-Windows.zip -Force

      - name: Publish downloadable build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: Windows Build ${{ github.run_number }}
          body: Automated Windows build of Rust yt-dlp GUI.
          prerelease: true
          files: Rust-yt-dlp-GUI-Windows.zip
