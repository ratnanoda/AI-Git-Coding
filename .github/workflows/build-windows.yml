name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/build-windows.yml"
      - "BUILD_TRIGGER"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release EXE
        run: cargo build --release

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item target/release/rust-ytdlp-gui.exe package/Rust-yt-dlp-GUI.exe
          Copy-Item README.md package/README.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Rust-yt-dlp-GUI-Windows
          path: package/*
          if-no-files-found: error
