name: Build Ultralight In-Game LiquidBounce ClickGUI

on:
  push:
    branches:
      - tmp/liquidbounce-ultralight-ingame-clickgui-20260810

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LiquidBounce nextgen
        uses: actions/checkout@v6
        with:
          repository: CCBlueX/LiquidBounce
          ref: nextgen
          submodules: recursive

      - name: Install ultralight shared-browser ClickGUI
        shell: bash
        run: |
          cat > src/main/kotlin/net/ccbluex/liquidbounce/features/module/modules/render/ModuleClickGui.kt <<'KOTLIN'
          /*
           * This file is part of LiquidBounce (https://github.com/CCBlueX/LiquidBounce)
           *
           * Copyright (c) 2015 - 2026 CCBlueX
           *
           * LiquidBounce is free software: you can redistribute it and/or modify
           * it under the terms of the GNU General Public License as published by
           * the Free Software Foundation, either version 3 of the License, or
           * (at your option) any later version.
           */
          package net.ccbluex.liquidbounce.features.module.modules.render

          import net.ccbluex.liquidbounce.LiquidBounce
          import net.ccbluex.liquidbounce.config.types.group.ToggleableValueGroup
          import net.ccbluex.liquidbounce.event.EventManager
          import net.ccbluex.liquidbounce.event.events.ClickGuiScaleChangeEvent
          import net.ccbluex.liquidbounce.event.events.ClickGuiValueChangeEvent
          import net.ccbluex.liquidbounce.features.module.ClientModule
          import net.ccbluex.liquidbounce.features.module.ModuleCategories
          import net.ccbluex.liquidbounce.integration.screen.CustomScreenType
          import net.ccbluex.liquidbounce.integration.screen.impl.CustomSharedMinecraftScreen
          import net.ccbluex.liquidbounce.utils.client.inGame
          import net.ccbluex.liquidbounce.utils.client.mc
          import org.lwjgl.glfw.GLFW

          /**
           * Ultralight ClickGUI.
           *
           * Uses ScreenManager's single shared integration browser instead of
           * allocating a dedicated ClickGUI browser instance.
           */
          object ModuleClickGui :
              ClientModule("ClickGUI", ModuleCategories.RENDER, bind = GLFW.GLFW_KEY_RIGHT_SHIFT, disableActivation = true) {

              override val running get() = true

              @Suppress("UnusedPrivateProperty")
              private val scale by float("Scale", 1f, 0.5f..2f).onChanged {
                  EventManager.callEvent(ClickGuiScaleChangeEvent(it))
                  EventManager.callEvent(ClickGuiValueChangeEvent(this))
              }

              // Retained for config compatibility. The ultralight UI intentionally has no search box.
              @Suppress("UnusedPrivateProperty", "unused")
              private val searchBarAutoFocus by boolean("SearchBarAutoFocus", false).onChanged {
                  EventManager.callEvent(ClickGuiValueChangeEvent(this))
              }

              // Retained for compatibility with existing ClickGUI configs.
              object Snapping : ToggleableValueGroup(this, "Snapping", false) {
                  @Suppress("UnusedPrivateProperty", "unused")
                  private val gridSize by int("GridSize", 10, 1..100, "px").onChanged {
                      EventManager.callEvent(ClickGuiValueChangeEvent(ModuleClickGui))
                  }

                  init {
                      inner.find { it.name == "Enabled" }?.onChanged {
                          EventManager.callEvent(ClickGuiValueChangeEvent(ModuleClickGui))
                      }
                  }
              }

              val isInSearchBar: Boolean
                  get() = false

              init {
                  tree(Snapping)
              }

              override fun onEnabled() {
                  if (!LiquidBounce.isInitialized || !inGame) {
                      return
                  }

                  mc.execute {
                      mc.gui.setScreen(CustomSharedMinecraftScreen(CustomScreenType.CLICK_GUI))
                  }
                  super.onEnabled()
              }

              fun sync() = Unit
              fun invalidate() = Unit
          }
          KOTLIN

          cat > src-theme/src/routes/clickgui/TabbedClickGui.svelte <<'SVELTE'
          <script lang="ts">
              import ClickGui from "./ClickGui.svelte";
              import {os, scaleFactor} from "./clickgui_store";
              import type {ConfigurableSetting} from "../../integration/types";
              import {onMount} from "svelte";
              import {
                  getClientInfo,
                  getGameWindow,
                  getModuleSettings,
                  setHudEditorSelected,
                  setTyping
              } from "../../integration/rest";
              import {listen} from "../../integration/ws";
              import type {ClickGuiValueChangeEvent, ScaleFactorChangeEvent} from "../../integration/events";

              let minecraftScaleFactor = $state(2);
              let clickGuiScaleFactor = $state(1);

              $effect(() => {
                  $scaleFactor = minecraftScaleFactor * clickGuiScaleFactor;
              });

              function applyValues(configurable: ConfigurableSetting) {
                  const scaleValue = configurable.value.find(v => v.name === "Scale");
                  if (scaleValue) {
                      clickGuiScaleFactor = scaleValue.value as number;
                  }
              }

              onMount(async () => {
                  await setHudEditorSelected(false);
                  $os = (await getClientInfo()).os;
                  minecraftScaleFactor = (await getGameWindow()).scaleFactor;
                  applyValues(await getModuleSettings("ClickGUI"));
                  await setTyping(false);
              });

              listen("scaleFactorChange", (e: ScaleFactorChangeEvent) => {
                  minecraftScaleFactor = e.scaleFactor;
              });

              listen("clickGuiValueChange", (e: ClickGuiValueChangeEvent) => {
                  applyValues(e.configurable);
              });
          </script>

          <div class="ultralight-clickgui">
              <ClickGui/>
          </div>

          <style lang="scss">
            .ultralight-clickgui {
              position: absolute;
              inset: 0;
              overflow: hidden;
            }
          </style>
          SVELTE

          cat > src-theme/src/routes/clickgui/ClickGui.svelte <<'SVELTE'
          <script lang="ts">
              import type {GroupedModules, Module} from "../../integration/types";
              import Panel from "./Panel.svelte";
              import {onMount} from "svelte";
              import {getModules} from "../../integration/rest";
              import {groupByCategory} from "../../integration/util";
              import ScaledClickGuiContent from "./ScaledClickGuiContent.svelte";

              let categories = $state<GroupedModules>({});

              onMount(async () => {
                  const modules: Module[] = await getModules();
                  categories = groupByCategory(modules);
              });
          </script>

          <ScaledClickGuiContent>
              <div class="clickgui">
                  {#each Object.entries(categories) as [category, modules], panelIndex (category)}
                      <Panel {category} {modules} {panelIndex}/>
                  {/each}
              </div>
          </ScaledClickGuiContent>

          <style lang="scss">
            .clickgui {
              position: absolute;
              inset: 0;
            }
          </style>
          SVELTE

          cat > src-theme/src/routes/clickgui/Panel.svelte <<'SVELTE'
          <script lang="ts">
              import {onMount} from "svelte";
              import type {Module as TModule} from "../../integration/types";
              import {listen} from "../../integration/ws";
              import Module from "./Module.svelte";
              import type {ModuleToggleEvent} from "../../integration/events";
              import {maxPanelZIndex, scaleFactor} from "./clickgui_store";

              export let category: string;
              export let modules: TModule[];
              export let panelIndex: number;

              let panelElement: HTMLElement;
              let modulesElement: HTMLElement;
              let expandButtonElement: HTMLElement;
              let moving = false;
              let offsetX = 0;
              let offsetY = 0;
              let scrollSaveTimer: number | undefined;

              interface PanelConfig {
                  top: number;
                  left: number;
                  expanded: boolean;
                  scrollTop: number;
                  zIndex: number;
              }

              function loadPanelConfig(): PanelConfig {
                  const raw = localStorage.getItem(`clickgui.panel.${category}`);
                  if (!raw) {
                      return {
                          top: panelIndex * 44 + 12,
                          left: 12,
                          expanded: false,
                          scrollTop: 0,
                          zIndex: 0
                      };
                  }

                  try {
                      const value = JSON.parse(raw) as PanelConfig;
                      if (value.zIndex > $maxPanelZIndex) $maxPanelZIndex = value.zIndex;
                      return value;
                  } catch {
                      return {
                          top: panelIndex * 44 + 12,
                          left: 12,
                          expanded: false,
                          scrollTop: 0,
                          zIndex: 0
                      };
                  }
              }

              const panelConfig = loadPanelConfig();

              function savePanelConfig() {
                  localStorage.setItem(`clickgui.panel.${category}`, JSON.stringify(panelConfig));
              }

              function clamp(value: number, min: number, max: number) {
                  return Math.max(min, Math.min(value, max));
              }

              function fixPosition() {
                  if (!panelElement) return;
                  panelConfig.left = clamp(
                      panelConfig.left,
                      0,
                      document.documentElement.clientWidth * (2 / $scaleFactor) - panelElement.offsetWidth
                  );
                  panelConfig.top = clamp(
                      panelConfig.top,
                      0,
                      document.documentElement.clientHeight * (2 / $scaleFactor) - panelElement.offsetHeight
                  );
              }

              function onMouseDown(e: MouseEvent) {
                  if (e.button !== 0 && e.button !== 1) return;
                  moving = true;
                  offsetX = e.clientX * (2 / $scaleFactor) - panelConfig.left;
                  offsetY = e.clientY * (2 / $scaleFactor) - panelConfig.top;
                  panelConfig.zIndex = ++$maxPanelZIndex;
              }

              function onMouseMove(e: MouseEvent) {
                  if (!moving) return;
                  panelConfig.left = e.clientX * (2 / $scaleFactor) - offsetX;
                  panelConfig.top = e.clientY * (2 / $scaleFactor) - offsetY;
                  fixPosition();
              }

              function onMouseUp() {
                  if (moving) savePanelConfig();
                  moving = false;
              }

              function toggleExpanded() {
                  panelConfig.expanded = !panelConfig.expanded;
                  fixPosition();
                  savePanelConfig();
              }

              function handleModulesScroll() {
                  panelConfig.scrollTop = modulesElement.scrollTop;
                  if (scrollSaveTimer !== undefined) clearTimeout(scrollSaveTimer);
                  scrollSaveTimer = window.setTimeout(savePanelConfig, 400);
              }

              listen("moduleToggle", (e: ModuleToggleEvent) => {
                  const mod = modules.find(m => m.name === e.moduleName);
                  if (!mod) return;
                  mod.enabled = e.enabled;
                  modules = modules;
              });

              onMount(() => {
                  if (modulesElement) modulesElement.scrollTop = panelConfig.scrollTop;
              });
          </script>

          <svelte:window on:mouseup={onMouseUp} on:mousemove={onMouseMove}/>

          <div
                  class="panel"
                  style="left: {panelConfig.left}px; top: {panelConfig.top}px; z-index: {panelConfig.zIndex};"
                  bind:this={panelElement}
          >
              <div
                      class="title"
                      on:mousedown={onMouseDown}
                      on:contextmenu|preventDefault={toggleExpanded}
              >
                  <img class="category-icon" src="img/clickgui/icon-{category.toLowerCase()}.svg" alt=""/>
                  <span class="category">{category}</span>
                  <button class="expand-toggle" on:click={toggleExpanded} bind:this={expandButtonElement} aria-label="Toggle category">
                      {panelConfig.expanded ? "−" : "+"}
                  </button>
              </div>

              {#if panelConfig.expanded}
                  <div class="modules" on:scroll={handleModulesScroll} bind:this={modulesElement}>
                      {#each modules as {name, enabled} (name)}
                          <Module {name} {enabled}/>
                      {/each}
                  </div>
              {/if}
          </div>

          <style lang="scss">
            .panel {
              width: 220px;
              position: absolute;
              overflow: hidden;
              border-radius: 3px;
              user-select: none;
              background: var(--clickgui-panel-body-background-color);
            }

            .title {
              display: grid;
              grid-template-columns: 18px 1fr 28px;
              align-items: center;
              gap: 8px;
              min-height: 34px;
              padding: 3px 8px;
              background: var(--clickgui-panel-header-background-color);
              border-bottom: 1px solid var(--clickgui-panel-header-border-color);
              cursor: grab;
            }

            .category-icon {
              width: 14px;
              height: 14px;
            }

            .category {
              font-size: 13px;
              color: var(--clickgui-text-color);
              font-weight: 500;
            }

            .expand-toggle {
              all: unset;
              text-align: center;
              cursor: pointer;
              color: var(--clickgui-text-color);
              font-size: 17px;
            }

            .modules {
              max-height: 520px;
              overflow-y: auto;
              overflow-x: hidden;
              background: var(--clickgui-panel-body-background-color);
            }

            .modules::-webkit-scrollbar {
              width: 2px;
            }
          </style>
          SVELTE

          cat > src-theme/src/routes/clickgui/Module.svelte <<'SVELTE'
          <script lang="ts">
              import {
                  getModuleSettings,
                  setModuleSettings,
                  setModuleEnabled,
              } from "../../integration/rest";
              import type {ConfigurableSetting} from "../../integration/types";
              import GenericSetting from "./setting/common/GenericSetting.svelte";
              import {convertToSpacedString, spaceSeperatedNames} from "../../theme/theme_config";

              export let name: string;
              export let enabled: boolean;

              const path = `clickgui.${name}`;
              let configurable: ConfigurableSetting | undefined;
              let expanded = false;
              let loading = false;

              async function toggleModule() {
                  await setModuleEnabled(name, !enabled);
              }

              async function toggleExpanded(e: MouseEvent) {
                  e.stopPropagation();

                  if (expanded) {
                      expanded = false;
                      return;
                  }

                  if (!configurable) {
                      loading = true;
                      try {
                          configurable = await getModuleSettings(name);
                      } finally {
                          loading = false;
                      }
                  }

                  const hasSettings = configurable.value.some(v => v.name !== "Bind" && v.name !== "Hidden");
                  if (hasSettings) expanded = true;
              }

              async function updateModuleSettings() {
                  if (!configurable) return;
                  await setModuleSettings(name, configurable);
              }
          </script>

          <div class="module" class:expanded>
              <div
                      class="name"
                      class:enabled
                      on:click={toggleModule}
                      on:contextmenu|preventDefault={toggleExpanded}
              >
                  <span>{$spaceSeperatedNames ? convertToSpacedString(name) : name}</span>
                  <button
                          class="settings-toggle"
                          on:click={toggleExpanded}
                          aria-label="Load module settings"
                          aria-expanded={expanded}
                  >
                      {loading ? "…" : (expanded ? "−" : "›")}
                  </button>
              </div>

              {#if expanded && configurable}
                  <div class="settings">
                      {#each configurable.value as setting (setting.name)}
                          <GenericSetting {path} bind:setting on:change={updateModuleSettings}/>
                      {/each}
                  </div>
              {/if}
          </div>

          <style lang="scss">
            .module {
              position: relative;
            }

            .name {
              display: grid;
              grid-template-columns: 1fr 32px;
              align-items: center;
              min-height: 31px;
              padding-left: 9px;
              cursor: pointer;
              color: var(--clickgui-text-dimmed-color);
              font-size: 12px;
              font-weight: 500;
              border-bottom: 1px solid color-mix(in srgb, var(--clickgui-panel-header-border-color) 35%, transparent);
            }

            .name:hover {
              background: var(--clickgui-module-hover-background-color);
              color: var(--clickgui-text-color);
            }

            .name.enabled {
              color: var(--clickgui-module-enabled-color);
            }

            .settings-toggle {
              all: unset;
              height: 31px;
              text-align: center;
              cursor: pointer;
              color: var(--clickgui-text-dimmed-color);
              font-size: 17px;
            }

            .settings {
              background: var(--clickgui-module-settings-background-color);
              border-left: 2px solid var(--clickgui-module-settings-border-color);
              padding: 0 8px 0 6px;
            }
          </style>
          SVELTE

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/kotlin/net/ccbluex/liquidbounce/integration/screen/impl/CustomSharedMinecraftScreen.kt')
          s = p.read_text()
          old = '''    override fun isInGameUi(): Boolean {
                  return screenType == CustomScreenType.CLICK_GUI && ModuleHud.hudEditorSelected
              }'''
          new = '''    override fun isInGameUi(): Boolean {
                  // The ultralight ClickGUI never needs Minecraft's blurred background.
                  // Treat it as an in-game UI so only the browser texture is composited.
                  return screenType == CustomScreenType.CLICK_GUI
              }'''
          if old not in s:
              raise SystemExit('CustomSharedMinecraftScreen target block not found')
          p.write_text(s.replace(old, new))

          p = Path('src/main/kotlin/net/ccbluex/liquidbounce/integration/screen/ScreenManager.kt')
          s = p.read_text()
          old = 'val browserSettings = IntegrationBrowserSettings(0, ::restart)'
          new = 'val browserSettings = IntegrationBrowserSettings(30, ::restart)'
          if old not in s:
              raise SystemExit('ScreenManager browserSettings target not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Detect JDK version
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          JDK_VERSION=$(grep '^jdk[[:space:]]*=' gradle/libs.versions.toml | head -n1 | sed -n 's/^[^=]*=[[:space:]]*"\([^"]*\)".*/\1/p')
          test -n "$JDK_VERSION"
          echo "jdk=$JDK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.jdk }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare theme permissions
        run: sudo chmod -R 777 src-theme

      - name: Build LiquidBounce
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -x test -x detekt

      - name: Collect JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          JAR=$(find build/libs -maxdepth 1 -type f -regex '.*/liquidbounce-[0-9.]*\.jar' | head -n1)
          test -n "$JAR"
          cp "$JAR" artifact/liquidbounce-ultralight-ingame-clickgui.jar
          sha256sum artifact/liquidbounce-ultralight-ingame-clickgui.jar | tee artifact/SHA256SUMS.txt

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: liquidbounce-ultralight-ingame-clickgui
          path: artifact/
          if-no-files-found: error
          retention-days: 1
